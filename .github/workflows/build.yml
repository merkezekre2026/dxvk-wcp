name: DXVK GPLAsync Build Automation

on:
  workflow_dispatch:
    inputs:
      dxvk_version:
        description: 'DXVK-gplasync version tag or branch (e.g., v2.7.1-1, v2.7-1, main)'
        required: true
        default: 'main'
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build & Package DXVK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3 glslang-tools zstd jq curl

      - name: Download & Setup llvm-mingw
        run: |
          # Pin to stable llvm-mingw version 20240619 to avoid libc++ compatibility issues in bleeding edge LLVM releases
          TAG="20240619"
          echo "Using pinned llvm-mingw version: $TAG"
          
          # Construct download URL (stable Ubuntu 20.04 build which runs fine on newer systems)
          DOWNLOAD_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/$TAG/llvm-mingw-$TAG-ucrt-ubuntu-20.04-x86_64.tar.xz"
          
          echo "Downloading toolchain from: $DOWNLOAD_URL"
          curl -Lo llvm-mingw.tar.xz "$DOWNLOAD_URL"
          
          echo "Extracting toolchain..."
          tar -xf llvm-mingw.tar.xz
          
          # Find the name of the extracted directory dynamically
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "llvm-mingw-*" | head -n 1)
          echo "Extracted directory: $EXTRACTED_DIR"
          
          # Add the binary path to the runner environment
          echo "$(pwd)/$EXTRACTED_DIR/bin" >> $GITHUB_PATH

      - name: Run Build Script
        env:
          DXVK_VERSION: ${{ github.event.inputs.dxvk_version || 'main' }}
        run: |
          ./build.sh

      - name: Upload standard .wcp package
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-gplasync-standard
          path: out/dxvk-gplasync-standard.wcp

      - name: Upload arm64ec .wcp package
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-gplasync-arm64ec
          path: out/dxvk-gplasync-arm64ec.wcp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.dxvk_version || 'main' }}-${{ github.run_number }}
          name: DXVK GPLAsync (${{ github.event.inputs.dxvk_version || 'main' }}) Build
          draft: false
          prerelease: false
          files: |
            out/dxvk-gplasync-standard.wcp
            out/dxvk-gplasync-arm64ec.wcp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
